<!doctype html>
<!--
  Anteprima della card senza Home Assistant, con dati finti.
  Aprire da un server locale (i moduli non si caricano da file://):
    cd homeassistant/solar-combo-card && python3 -m http.server 8000
    http://localhost:8000/dev/anteprima.html?scenario=giorno   (giorno | notte | carica)
  ha-card è sostituito da un segnaposto.
-->
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Solar Combo Card · anteprima</title>
  <style>
    body { font-family: Roboto, Arial, sans-serif; background: #f0f0f0; margin: 24px; }
    .riga { display: flex; gap: 24px; flex-wrap: wrap; }
    .riga > div { width: 460px; }
    h3 { font-weight: 500; margin: 0 0 6px; }
    .scuro { --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
             --card-background-color: #1c1c1c; --secondary-background-color: #2a2a2a; }
  </style>
  <script>
    // Segnaposto dei componenti di Home Assistant
    customElements.define("ha-card", class extends HTMLElement {
      connectedCallback() {
        this.style.cssText = "display:block;border-radius:12px;box-shadow:0 1px 3px #0003;" +
          "background:var(--card-background-color,#fff)";
      }
    });
  </script>
  <script type="module" src="../dist/solar-combo-card.js"></script>
</head>
<body>
  <div class="riga">
    <div><h3>Tema chiaro</h3><div id="chiaro"></div></div>
    <div class="scuro" style="background:#111;padding:8px;border-radius:12px">
      <h3 style="color:#ddd">Tema scuro</h3><div id="scuro"></div></div>
  </div>
  <script type="module">
    const SCENARI = {
      // giorno: FV carica la batteria e alimenta la casa, R4850G2 in standby
      giorno: { pv1: [2150, 312, 6.9], pv2: [1870, 298, 6.3], casa: 1240, bms: [2650, 54.1, 49.0],
                soc: 72, r48: [0, 0, 0], rete: [0, 231], standby: "on", modo: "Off-Grid",
                carica: "In attesa (cella min 3,318 V)", allarmi: "", ah: 0, rich: 0 },
      // notte: la batteria alimenta la casa
      notte: { pv1: [0, 12, 0], pv2: [0, 10, 0], casa: 680, bms: [-760, 51.6, -14.7],
               soc: 38, r48: [0, 0, 0], rete: [0, 230], standby: "on", modo: "Off-Grid",
               carica: "In attesa (cella min 3,212 V)", allarmi: "", ah: 0, rich: 0 },
      // carica: il R4850G2 carica dalla rete, la casa va a batteria
      carica: { pv1: [140, 280, 0.5], pv2: [120, 276, 0.4], casa: 950, bms: [1650, 53.2, 31.0],
                soc: 21, r48: [2580, 53.6, 48.1], rete: [2790, 229], standby: "off", modo: "Off-Grid",
                carica: "In carica (12,4 Ah)", allarmi: "Cell UVP", ah: 12.4, rich: 27.5 },
    };
    const nome = new URLSearchParams(location.search).get("scenario") || "giorno";
    const s = SCENARI[nome] || SCENARI.giorno;
    const p = "solar_combo";
    const st = (v) => ({ state: String(v) });
    const states = {
      [`sensor.${p}_smg_ii_pv1_power`]: st(s.pv1[0]), [`sensor.${p}_smg_ii_pv1_voltage`]: st(s.pv1[1]),
      [`sensor.${p}_smg_ii_pv1_current`]: st(s.pv1[2]),
      [`sensor.${p}_smg_ii_pv2_power`]: st(s.pv2[0]), [`sensor.${p}_smg_ii_pv2_voltage`]: st(s.pv2[1]),
      [`sensor.${p}_smg_ii_pv2_current`]: st(s.pv2[2]),
      [`sensor.${p}_smg_ii_operation_mode`]: st(s.modo), [`sensor.${p}_smg_ii_temperature`]: st(41),
      [`sensor.${p}_smg_ii_output_active_power`]: st(s.casa),
      [`sensor.${p}_smg_ii_output_effective_voltage`]: st(230),
      [`sensor.${p}_bms_state_of_charge`]: st(s.soc), [`sensor.${p}_bms_potenza`]: st(s.bms[0]),
      [`sensor.${p}_bms_tensione_totale`]: st(s.bms[1]), [`sensor.${p}_bms_corrente`]: st(s.bms[2]),
      [`sensor.${p}_bms_cella_minima`]: st(3.301), [`sensor.${p}_bms_cella_massima`]: st(3.312),
      [`sensor.${p}_bms_delta_celle`]: st(11), [`sensor.${p}_bms_allarmi`]: st(s.allarmi),
      [`sensor.${p}_r4850g2_output_power`]: st(s.r48[0]), [`sensor.${p}_r4850g2_output_voltage`]: st(s.r48[1]),
      [`sensor.${p}_r4850g2_output_current`]: st(s.r48[2]),
      [`switch.${p}_r4850g2_standby`]: st(s.standby), [`switch.${p}_gestione_automatica_carica`]: st("on"),
      [`sensor.${p}_stato_gestione_carica`]: st(s.carica),
      [`sensor.${p}_r4850g2_input_power`]: st(s.rete[0]), [`sensor.${p}_r4850g2_input_voltage`]: st(s.rete[1]),
      // gestione automatica della carica
      [`number.${p}_carica_avvio_sotto_cella_min`]: st(3.05), [`number.${p}_carica_stop_sopra_cella_min`]: st(3.25),
      [`number.${p}_carica_conferma_avvio`]: st(3), [`number.${p}_carica_ah_minimi`]: st(40),
      [`number.${p}_carica_tensione_r4850g2`]: st(55.1), [`number.${p}_carica_corrente_r4850g2`]: st(10),
      [`number.${p}_carica_margine_sul_consumo`]: st(10), [`number.${p}_carica_completa_ogni_giorni`]: st(21),
      [`sensor.${p}_carica_ah_caricati`]: st(s.ah), [`sensor.${p}_carica_corrente_richiesta`]: st(s.rich),
      [`sensor.${p}_soglia_cella_max_carica`]: st(3.414), [`sensor.${p}_soglia_cella_max_protezione`]: st(3.544),
      [`sensor.${p}_giorni_dall_ultima_carica_completa`]: st(5.2),
    };
    const hass = { states, locale: { language: "it" } };
    await customElements.whenDefined("solar-combo-card");
    for (const id of ["chiaro", "scuro"]) {
      const card = document.createElement("solar-combo-card");
      card.setConfig({ title: `Solar Combo · ${nome}` });
      card.hass = hass;
      card.addEventListener("hass-more-info", (e) => console.log("more-info", e.detail.entityId));
      document.getElementById(id).appendChild(card);
    }
  </script>
</body>
</html>
